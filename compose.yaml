x-dotnet-service: &dotnet-service
  image: mcr.microsoft.com/dotnet/sdk:10.0
  # --no-launch-profile: sem isso o applicationUrl do launchSettings.json (localhost:5033)
  # sobrepõe ASPNETCORE_HTTP_PORTS e o Kestrel escuta no loopback interno do container.
  command: dotnet watch run --non-interactive --no-launch-profile --project .
  working_dir: /app
  environment: &dotnet-env
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_HTTP_PORTS: 8080
    DOTNET_WATCH_RESTART_ON_RUDE_EDIT: 1
    NUGET_PACKAGES: /nuget
  # O vsdbg precisa de ptrace, que o Docker bloqueia por padrão. Afrouxamento só de dev.
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp:unconfined
  restart: unless-stopped

x-postgres: &postgres
  image: postgres:18-alpine
  environment: &postgres-env
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  healthcheck:
    # -d postgres: sem isso o pg_isready usa dbname = username, que não existe, e o servidor
    # loga um FATAL a cada intervalo. O check só verifica se o servidor aceita conexão.
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
    interval: 5s
    timeout: 5s
    retries: 10
  restart: unless-stopped

services:
  # ---------- Production ----------
  production-api:
    <<: *dotnet-service
    container_name: minimes-production-api
    volumes:
      - ./backend/src/MiniMes.Production:/app
      # Volumes anônimos: o build do container não colide com o do host.
      - /app/bin
      - /app/obj
      - nuget:/nuget
      - vsdbg:/vsdbg
    ports:
      - "5033:8080"
    environment:
      <<: *dotnet-env
      ConnectionStrings__Postgres: >-
        Host=production-db;Port=5432;Database=production_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      production-db:
        condition: service_healthy

  production-db:
    <<: *postgres
    container_name: minimes-production-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: production_db
    ports:
      - "5434:5432"
    volumes:
      - production_db_data:/var/lib/postgresql

  # ---------- Frontend ----------
  web:
    image: node:22-alpine
    container_name: minimes-web
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      # Volumes anônimos, mesma razão do bin/obj: o node_modules do container é linux e não
      # pode ser sobrescrito pelo do host.
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      # Só o servidor do Next fala com a API — o browser nunca vê esta URL, então a API
      # continua sem precisar de CORS.
      API_BASE_URL: http://production-api:8080
    depends_on:
      - production-api
    restart: unless-stopped

volumes:
  nuget:
  vsdbg:
  production_db_data:
